    artifact-name: eyelash_sofle_central_dongle_no_relay
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_left nice_view
    cmake-args: -DCONFIG_ZMK_SETTINGS_RPC=n -DCONFIG_ZMK_SPLIT_RELAY_EVENT=n
    artifact-name: eyelash_sofle_peripheral_left_no_relay
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_right nice_view
    cmake-args: -DCONFIG_ZMK_SETTINGS_RPC=n -DCONFIG_ZMK_SPLIT_RELAY_EVENT=n
    artifact-name: eyelash_sofle_peripheral_right_no_relay
  - board: nice_nano_v2
    shield: settings_reset
